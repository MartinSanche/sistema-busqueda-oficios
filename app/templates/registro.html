{% extends 'base.html' %}
{% block title %}Registro — Búsqueda de Oficios{% endblock %}

{% block content %}
<section class="section" style="max-width:480px; margin:0 auto;">
    <h2 style="margin-bottom:24px;">Crear cuenta</h2>

    <div class="search-box">
        <div id="mensaje-resultado"></div>

        <div class="field" style="margin-bottom:16px;">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
        </div>
        <div class="field" style="margin-bottom:16px;">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tu@email.com">
        </div>
        <div class="field" style="margin-bottom:16px;">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="field" style="margin-bottom:24px;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:#c0d0e0; font-size:0.85rem;">
                <input type="checkbox" id="es-profesional" style="width:16px; height:16px; cursor:pointer; accent-color:#2c6fad; flex-shrink:0;">
                Quiero registrarme como profesional
            </label>
        </div>

        <button class="btn btn-primary" onclick="registrar()" style="width:100%">
            Crear cuenta
        </button>
        <p style="margin-top:16px; font-size:0.85rem; color:#667788; text-align:center;">
            ¿Ya tenés cuenta? <a href="/login" style="color:#2c6fad;">Iniciá sesión</a>
        </p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    async function registrar() {
        const nombre         = document.getElementById('nombre').value.trim()
        const email          = document.getElementById('email').value.trim()
        const password       = document.getElementById('password').value
        const es_profesional = document.getElementById('es-profesional').checked

        if (!nombre || !email || !password) {
            mostrarMensaje('Por favor completá todos los campos', 'error')
            return
        }
        if (password.length < 6) {
            mostrarMensaje('La contraseña debe tener al menos 6 caracteres', 'error')
            return
        }

        const btn = document.querySelector('.btn-primary')
        btn.disabled = true
        btn.textContent = 'Creando cuenta...'

        try {
            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, email, password, es_profesional })
            })
            const data = await res.json()

            if (res.ok) {
                mostrarMensaje(`✅ ¡Cuenta creada! Bienvenido/a, ${data.usuario.nombre}`, 'exito')
                document.getElementById('nombre').value = ''
                document.getElementById('email').value = ''
                document.getElementById('password').value = ''
                btn.textContent = '✅ Cuenta creada'
                setTimeout(() => window.location.href = '/login', 2000)
            } else {
                mostrarMensaje(`❌ ${data.error}`, 'error')
                btn.disabled = false
                btn.textContent = 'Crear cuenta'
            }
        } catch (err) {
            mostrarMensaje('Error al conectar con el servidor', 'error')
            btn.disabled = false
            btn.textContent = 'Crear cuenta'
        }
    }

    function mostrarMensaje(texto, tipo) {
        const div = document.getElementById('mensaje-resultado')
        const color = tipo === 'exito' ? '#27ae60' : '#e74c3c'
        div.innerHTML = `
            <p style="color:${color}; padding:12px; border-radius:8px;
                      background:${color}20; margin-bottom:16px; font-size:0.9rem;">
                ${texto}
            </p>`
    }
</script>
{% endblock %}
