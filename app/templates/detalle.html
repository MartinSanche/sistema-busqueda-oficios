{% extends 'base.html' %}
{% block title %}Perfil del Profesional{% endblock %}

{% block content %}
<section class="section">
    <a href="/buscar" class="btn btn-secondary btn-volver">
        ← Volver a búsqueda
    </a>
    <div id="detalle-container">
        <p class="loading">⏳ Cargando perfil...</p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
    const profesionalId = {{ profesional_id }}

    function formatearTelefono(tel) {
        return tel.replace(/\D/g, '')
    }

    async function cargarDetalle() {
        try {
            const p = await API.getProfesional(profesionalId)
            document.getElementById('detalle-container').innerHTML = `
                <div class="card-profesional">

                    <div class="prof-header">
                        <h2>${p.nombre}</h2>
                        <span class="badge">${p.oficio}</span>
                    </div>

                    <p class="prof-descripcion">
                        ${p.descripcion || 'Sin descripción'}
                    </p>

                    <div class="prof-info">
                        <span>📍 ${p.ubicacion}</span>
                        <span>⏱ ${p.experiencia_anios} años de experiencia</span>
                    </div>

                    <div class="prof-section">
                        <h3>Contacto</h3>
                        <p class="prof-info-item">📞 ${p.telefono || 'No disponible'}</p>
                        <div class="prof-actions" style="margin-top:16px;">
                            ${p.telefono ? `
                                <a href="https://wa.me/${formatearTelefono(p.telefono)}?text=${encodeURIComponent('Hola! Te contacto desde Búsqueda de Oficios. Me interesa tu servicio de ' + p.oficio + '.')}"
                                   target="_blank" class="btn btn-whatsapp">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="white">
                                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                                        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.845L0 24l6.335-1.508A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.885 0-3.652-.513-5.168-1.408l-.371-.22-3.814.908.966-3.698-.242-.381A9.956 9.956 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
                                    </svg>
                                    Contactar por WhatsApp
                                </a>
                            ` : '<p class="prof-info-item">Sin teléfono disponible</p>'}
                        </div>
                    </div>

                    <div class="prof-section">
                        <span class="${p.disponible ? 'badge' : 'badge badge-inactive'}">
                            ${p.disponible ? '✅ Disponible' : '❌ No disponible'}
                        </span>
                    </div>

                    <div class="prof-section">
                        <h3>★ Valoración</h3>
                        <p class="valoracion-promedio">
                            ${p.valoracion > 0
                                ? '★'.repeat(Math.round(p.valoracion)) +
                                  ` <span class="valoracion-detalle">(${p.valoracion}/5 — ${p.total_valoraciones} valoraciones)</span>`
                                : '<span class="prof-info-desc">Sin valoraciones aún</span>'}
                        </p>
                        <p class="valoracion-label">Dejá tu valoración:</p>
                        <div class="valoracion-buttons">
                            ${[1,2,3,4,5].map(n => `
                                <button onclick="valorar(${p.id}, ${n})" class="btn-valorar">
                                    ${'★'.repeat(n)}
                                </button>
                            `).join('')}
                        </div>
                        <div id="msg-valoracion"></div>
                    </div>

                </div>
            `
        } catch (error) {
            mostrarError('detalle-container', 'No se encontró el profesional')
        }
    }

    async function valorar(id, puntuacion) {
        try {
            const response = await fetch(`/api/profesional/${id}/valorar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ puntuacion })
            })
            const data = await response.json()
            document.getElementById('msg-valoracion').innerHTML =
                `<p class="valoracion-mensaje-ok">✅ ${data.mensaje}</p>`
            setTimeout(() => cargarDetalle(), 1500)
        } catch (error) {
            document.getElementById('msg-valoracion').innerHTML =
                `<p class="valoracion-mensaje-error">❌ Error al valorar</p>`
        }
    }

    cargarDetalle()
</script>
{% endblock %}
