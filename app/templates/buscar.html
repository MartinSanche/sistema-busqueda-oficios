{% extends 'base.html' %}
{% block title %}Buscar — Búsqueda de Oficios{% endblock %}

{% block content %}
<section class="section">
    <h2>Buscar profesionales</h2>

    <div class="search-box">
        <div class="search-fields">
            <div class="field">
                <label for="oficio">Oficio</label>
                <select id="oficio">
                    <option value="">Todos los oficios</option>
                </select>
            </div>
            <div class="field">
                <label for="ubicacion">Ubicación</label>
                <select id="ubicacion">
                    <option value="">Todas las ubicaciones</option>
                </select>
            </div>
            <div class="field field-sm">
                <label for="experiencia">Experiencia mínima</label>
                <select id="experiencia">
                    <option value="0">Cualquiera</option>
                    <option value="1">1+ años</option>
                    <option value="3">3+ años</option>
                    <option value="5">5+ años</option>
                    <option value="10">10+ años</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="buscar()">
                Buscar
            </button>
        </div>
    </div>

    <div id="resultados">
        <p class="hint">Seleccioná un oficio o ubicación para buscar profesionales</p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
    async function cargarFiltros() {
        try {
            const dataOficios = await API.getOficios()
            const selectOficio = document.getElementById('oficio')
            dataOficios.oficios.forEach(o => {
                selectOficio.innerHTML += `<option value="${o.nombre}">${o.icono} ${o.nombre}</option>`
            })

            const dataProfesionales = await fetch('/api/profesionales').then(r => r.json())
            const ubicaciones = [...new Set(dataProfesionales.profesionales.map(p => p.ubicacion))]
            const selectUbicacion = document.getElementById('ubicacion')
            ubicaciones.forEach(u => {
                selectUbicacion.innerHTML += `<option value="${u}">📍 ${u}</option>`
            })
        } catch (e) {
            console.error('Error cargando filtros:', e)
        }
    }

    window.onload = async function() {
        await cargarFiltros()
        const params = new URLSearchParams(window.location.search)
        const oficio = params.get('oficio')
        if (oficio) {
            document.getElementById('oficio').value = oficio
            buscar()
        }
    }

    async function buscar() {
        const oficio      = document.getElementById('oficio').value
        const ubicacion   = document.getElementById('ubicacion').value
        const experiencia = document.getElementById('experiencia').value

        if (!oficio && !ubicacion) {
            mostrarVacio('resultados', 'Seleccioná al menos un criterio de búsqueda')
            return
        }

        mostrarLoading('resultados', 'Buscando profesionales...')

        try {
            const params = new URLSearchParams()
            if (oficio)      params.append('oficio', oficio)
            if (ubicacion)   params.append('ubicacion', ubicacion)
            if (experiencia) params.append('experiencia', experiencia)

            const response = await fetch(`/api/profesionales/filtrar?${params}`)
            const data = await response.json()
            mostrarResultados(data)
        } catch (error) {
            mostrarError('resultados', 'Error al buscar. Intentá de nuevo.')
        }
    }

    function mostrarResultados(data) {
        const div = document.getElementById('resultados')
        if (data.total === 0) {
            mostrarVacio('resultados', '😕 No se encontraron profesionales')
            return
        }
        div.innerHTML = `<p class="total">Se encontraron <strong>${data.total}</strong> profesionales</p>`
        data.resultados.forEach(p => {
            div.innerHTML += `
                <div class="card-profesional">
                    <div class="prof-header">
                        <h3>${p.nombre}</h3>
                        <span class="badge">${p.oficio}</span>
                    </div>
                    <p class="prof-descripcion">${p.descripcion || 'Sin descripción'}</p>
                    <div class="prof-info">
                        <span>📍 ${p.ubicacion}</span>
                        <span>⏱ ${p.experiencia_anios} años</span>
                        <span>📞 ${p.telefono || 'Sin teléfono'}</span>
                    </div>
                    <div class="prof-actions">
                        <a href="/profesional/${p.id}" class="btn btn-secondary">Ver perfil</a>
                        ${p.telefono ? `
                            <a href="https://wa.me/${p.telefono.replace(/\D/g,'')}?text=${encodeURIComponent('Hola! Te contacto desde Búsqueda de Oficios. Me interesa tu servicio de ' + p.oficio + '.')}"
                               target="_blank" class="btn btn-whatsapp">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="white">
                                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                                    <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.845L0 24l6.335-1.508A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.885 0-3.652-.513-5.168-1.408l-.371-.22-3.814.908.966-3.698-.242-.381A9.956 9.956 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
                                </svg>
                                WhatsApp
                            </a>
                        ` : ''}
                    </div>
                </div>
            `
        })
    }
</script>
{% endblock %}
