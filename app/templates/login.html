{% extends 'base.html' %}
{% block title %}Iniciar Sesión — Búsqueda de Oficios{% endblock %}

{% block content %}
<section class="section section-narrow" style="max-width:440px;">
    <h2>Iniciar Sesión</h2>

    <div class="search-box">
        <div id="mensaje-resultado"></div>

        <div class="field field-mb">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tu@email.com">
        </div>

        <div class="field field-mb">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Tu contraseña"
                   onkeypress="if(event.key==='Enter') iniciarSesion()">
        </div>

        <div class="field field-mb-lg">
            <label class="field-checkbox">
                <input type="checkbox" id="remember">
                Recordarme
            </label>
        </div>

        <button class="btn btn-primary btn-full" onclick="iniciarSesion()">
            Iniciar Sesión
        </button>

        <p class="form-footer">
            ¿No tenés cuenta?
            <a href="/registro">Registrate acá</a>
        </p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    async function iniciarSesion() {
        const email    = document.getElementById('email').value.trim()
        const password = document.getElementById('password').value
        const remember = document.getElementById('remember').checked

        if (!email || !password) {
            mostrarMensaje('Completá email y contraseña', 'error')
            return
        }

        const btn = document.querySelector('.btn-primary')
        btn.disabled = true
        btn.textContent = 'Ingresando...'

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, remember })
            })
            const data = await res.json()

            if (res.ok) {
                mostrarMensaje(`✅ ${data.mensaje}`, 'exito')
                setTimeout(() => window.location.href = '/', 1000)
            } else {
                mostrarMensaje(`❌ ${data.error}`, 'error')
                btn.disabled = false
                btn.textContent = 'Iniciar Sesión'
            }
        } catch (err) {
            mostrarMensaje('Error al conectar con el servidor', 'error')
            btn.disabled = false
            btn.textContent = 'Iniciar Sesión'
        }
    }

    function mostrarMensaje(texto, tipo) {
        const div = document.getElementById('mensaje-resultado')
        div.innerHTML = `<div class="form-message form-message-${tipo}">${texto}</div>`
    }
</script>
{% endblock %}
